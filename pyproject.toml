[project]
name = "tollgate"
version = "0.1.0"
description = "An LLM API gateway with rate limits, budgets and usage billing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "fastapi>=0.142.1",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "stripe>=15.6.1",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Every migration imports op and sa from the template, even when it only needs one.
"alembic/versions/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "openai>=3.22.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.coverage.run]
source = ["app", "scripts"]
# SQLAlchemy's async layer runs code in greenlets, and the test client in a thread: without
# these, lines after an await go uncounted.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_covered = true
show_missing = true
