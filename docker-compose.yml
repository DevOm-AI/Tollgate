x-app: &app
  build: .
  image: tollgate:dev
  env_file: .env
  volumes:
    - ./app:/app/app
    # Mounted so `alembic revision` run in a container writes into the repo.
    - ./alembic:/app/alembic
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # Runs once and exits; the api doesn't start until the schema is up to date.
  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    # The slim image has no curl; urlopen raises (exit 1) on the 503 from /health.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Background jobs, each once a minute: release reservations left open past their expiry,
  # and send usage from the outbox to Stripe.
  jobs:
    <<: *app
    command: python -m app.jobs

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tollgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tollgate}
      POSTGRES_DB: ${POSTGRES_DB:-tollgate}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # No persistence: Redis only holds rate limit buckets. Postgres holds all money state.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
